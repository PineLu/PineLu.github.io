<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050d18">
  <title>Pelican Rider V3 · Loading</title>
  <style>
    html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#050d18;color:#eefbff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.box{text-align:center}.ring{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:#79ecff;border-right-color:#b594ff;animation:s .9s linear infinite}p{font-size:12px;color:rgba(238,251,255,.65)}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box"><div class="ring"></div><b>Loading Pelican Rider V3</b><p>正在加载导演版 3D 世界…</p></div>
  <script>
    (async()=>{
      try{
        const files=Array.from({length:7},(_,i)=>`chunk${i+1}.txt?v=3`);
        const parts=await Promise.all(files.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(`${u}: ${r.status}`);return r.text();}));
        const html=parts.join('');
        document.open();document.write(html);document.close();
      }catch(e){document.body.innerHTML=`<div class="box"><b>V3 加载失败</b><p>${String(e.message||e)}</p></div>`;console.error(e);}
    })();
  </script>
</body>
</html>
